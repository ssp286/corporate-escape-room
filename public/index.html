<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SMRITIchain | Corporate Escape Room</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#f5f7ff;background:#090f1e}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1150px;margin:auto;padding:24px}.hero{background:linear-gradient(115deg,#132955,#101629);border:1px solid #2c4169;padding:24px;border-radius:20px;margin-bottom:20px}.muted{color:#a9b8d4}.eyebrow{color:#8bb7ff;text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{border:1px solid #293958;background:#141f35;border-radius:16px;padding:20px;margin-bottom:14px}.card h2,.card h3{margin-top:0}.btn{background:#29416a;color:white;border:1px solid #526a94;padding:11px 15px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}.btn.primary{background:#3877f6;border-color:#3877f6}.btn.warn{background:#a93647;border-color:#a93647}.btn:disabled{opacity:.4;cursor:not-allowed}input,select{font:inherit;background:#0d172a;border:1px solid #536583;color:#fff;padding:11px;border-radius:9px;width:100%}label{font-size:13px;color:#b9c9e4;display:block;margin:8px 0 5px}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#26395b;font-size:12px;font-weight:800}.good{color:#73e3a5}.bad{color:#ff999f}.big{font-size:clamp(34px,6vw,64px);font-weight:900;letter-spacing:.06em}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab.active{background:#3877f6}.clue{border-left:3px solid #7d9cf6;background:#1b2b46;padding:12px;margin:8px 0;border-radius:6px}.option{display:block;width:100%;text-align:left;padding:14px;margin:9px 0;background:#1c2e4b;border:2px solid #364d72;border-radius:10px;color:white;cursor:pointer;font-size:15px}.option.selected{border-color:#7aafff;background:#294b7e}.progress{height:12px;background:#263a56;border-radius:30px;overflow:hidden}.progress>div{height:100%;background:#61caa2}.count{font-size:28px;font-weight:900;color:#fcd278}.small{font-size:13px}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px;border-bottom:1px solid #344563;text-align:left}.note{background:#2b2740;border:1px solid #65517d;padding:13px;border-radius:10px}.center{text-align:center}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f2f5ff;color:#14213c;padding:12px 20px;border-radius:10px;display:none;z-index:10;max-width:90vw;box-shadow:0 8px 40px #0008}.locked{opacity:.7}h1{margin:6px 0 8px;font-size:clamp(27px,4vw,42px)}p{line-height:1.5}button:hover:not(:disabled){filter:brightness(1.15)}.teamgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}@media(max-width:600px){.wrap{padding:12px}.hero,.card{padding:16px}}
</style></head><body><main class="wrap"><header class="hero"><div class="eyebrow">SMRITIchain · Classified Simulation</div><h1>🏢 The Corporate Escape Room</h1><div class="muted">Five departments. Five secrets. One company to save. Every teammate must agree within 3 seconds.</div></header><div id="app"></div></main><div id="toast" role="status"></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),app=document.getElementById('app');let content=null,state=null,role=null,myId=null,token=null,pin=null,tab='lobby',monitorTeam=1,choice='',now=Date.now(),lastPuzzleKey='',message='';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(x){let el=document.getElementById('toast');el.textContent=x;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',4200)}
function call(event,payload={},done=()=>{}){socket.emit(event,payload,r=>{if(!r?.ok){notify(r?.error||'Something went wrong.');return}done(r)})}
function btn(label,action,kind=''){return `<button class="btn ${kind}" data-action="${action}">${label}</button>`}
function setHtml(x){app.innerHTML=x;bind()}
function home(){setHtml(`<div class="grid"><section class="card"><h2>🎛️ Host a game</h2><p class="muted">Create a PIN, assign five random departments, monitor progress and control the finale.</p>${btn('Create host lobby','create','primary')}</section><section class="card"><h2>💻 Join as a student</h2><label>Game PIN</label><input id="pin" inputmode="numeric" maxlength="6" placeholder="6-digit PIN"><label>Your name</label><input id="name" maxlength="24" placeholder="First name or nickname"><div style="margin-top:15px">${btn('Join game','join','primary')}</div></section></div>`)}
function header(){return `<div class="card space"><div><div class="eyebrow">GAME PIN</div><div class="big">${esc(state.pin)}</div></div><div><span class="pill">${esc(state.status.toUpperCase())}</span> <span class="pill">${state.players.length} players</span></div></div>`}
function host(){let tabs=['lobby','monitor','leaderboard','finale'];let nav=`<div class="tabs">${tabs.map(x=>`<button class="btn tab ${tab===x?'active':''}" data-tab="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>`;let body='';
if(tab==='lobby'){body=`<section class="card"><h2>Lobby & game controls</h2><p class="muted">Students visit this same website and enter PIN <b>${state.pin}</b>.</p><div class="flex">${btn('🎲 Randomly assign five teams','assign')}${btn('▶ Start department missions','start','primary')}${btn('🛑 End game','stop','warn')}</div><p class="small muted">At least five students are required. Students are spread randomly across five different departments.</p></section><div class="grid">${[1,2,3,4,5].map(i=>{let t=state.teams.find(x=>x.id===i),members=t?t.playerIds.map(id=>state.players.find(p=>p.id===id)?.name).filter(Boolean):[];return `<div class="card"><h3>Team ${i}: ${esc(content.departments[i-1].name)}</h3><p>${members.length?members.map(esc).join(', '):'Not assigned yet'}</p></div>`}).join('')}</div><section class="card"><h3>Joined players</h3><p>${state.players.length?state.players.map(p=>`${p.online?'🟢':'⚪'} ${esc(p.name)}`).join(' · '):'Waiting for players...'}</p></section>`}
if(tab==='monitor'){body=`<section class="card"><h2>Live team monitor</h2><p class="muted">Shows their in-game mission and live votes, not their actual desktop or browser tabs.</p><div class="flex">${[1,2,3,4,5].map(i=>`<button class="btn ${monitorTeam===i?'primary':''}" data-team="${i}">Team ${i}</button>`).join('')}</div></section>`;const t=state.teams.find(x=>x.id===monitorTeam);if(t){const d=content.departments[t.id-1],p=d.puzzles[t.step];body+=`<section class="card"><div class="eyebrow">${esc(d.name)}</div><h2>${t.step>=5?'Department mission completed':esc(p.title)}</h2><p>Progress: ${t.step}/5 puzzles · ${t.attempts} attempts · ${t.hints} hints</p>${p?`<p>${esc(p.story)}</p>${p.evidence.map(x=>`<div class="clue">${esc(x)}</div>`).join('')}<h3>${esc(p.question)}</h3>`:`<p class="good">Evidence fragment acquired: <b>${esc(d.name)}</b> (fragment word visible to team)</p>`}<p><b>Last answer:</b> ${esc(t.lastAnswer||'—')}</p><p><b>Last result:</b> ${esc(t.lastOutcome||'—')}</p><h3>Live 3-second vote</h3><p>${t.window?`<span class="count" data-countdown="${t.window.endsAt}">3.0</span> seconds remaining · ${t.window.answers.length}/${t.playerIds.filter(id=>state.players.find(p=>p.id===id)?.online).length} voted`:'Waiting for a team member to submit...'}</p>${t.window?t.window.answers.map(v=>`<div class="clue">${esc(state.players.find(p=>p.id===v.id)?.name||'Player')}: ${esc(v.answer)}</div>`).join(''):''}</section>`}else body+='<div class="card">Assign teams to begin monitoring.</div>'}
if(tab==='leaderboard'){body=`<section class="card"><h2>Live leaderboard</h2><table class="table"><thead><tr><th>Team</th><th>Department</th><th>Progress</th><th>Attempts</th><th>Status</th></tr></thead><tbody>${[...state.teams].sort((a,b)=>b.step-a.step||a.attempts-b.attempts).map(t=>`<tr><td>Team ${t.id}</td><td>${esc(t.department)}</td><td>${t.step}/5</td><td>${t.attempts}</td><td>${t.finalApproved?'🏆 Final approved':t.finishedAt?'✅ Done':'🔎 Investigating'}</td></tr>`).join('')}</tbody></table></section>`}
if(tab==='finale'){let ready=state.teams.length===5&&state.teams.every(t=>t.step===5);body=`<section class="card"><h2>🌐 Company-wide final mission</h2><p>Once all five teams finish their own five puzzles, start the finale. Each team must submit its unique evidence fragment. Only after all five fragments arrive can every team vote on the rescue plan.</p><p><b>Teams finished:</b> ${state.teams.filter(t=>t.step===5).length}/5</p><p><b>Evidence submitted:</b> ${state.teams.filter(t=>t.fragmentSubmitted).length}/5</p><div class="flex">${btn('🚨 Launch the company-wide finale','final','primary')}${btn(state.hintsEnabled?'Disable hints':'Enable hints','hints')}</div>${!ready?'<p class="bad">Finale stays locked until every department completes its mission.</p>':''}<div class="note">Facilitator tip: Ask each department to explain its evidence to the others before you let them choose the final plan.</div></section><section class="card"><h3>Five evidence fragments</h3>${state.teams.map(t=>`<p>Team ${t.id} (${esc(t.department)}): ${t.fragmentSubmitted?'✅ submitted':t.step===5?'🔑 solved, waiting to submit':'🔒 still investigating'}</p>`).join('')}</section>`}
setHtml(header()+nav+body)}
function student(){let me=state.players.find(p=>p.id===myId),t=state.teams.find(x=>x.id===me?.team);if(!me){home();return}let out=`<section class="card space"><div><div class="eyebrow">PLAYER</div><h2>${esc(me.name)}</h2></div><span class="pill">${t?`${esc(t.name)} · ${esc(t.department)}`:'Waiting for teams'}</span></section>`;
if(state.status==='lobby'){out+=`<section class="card center"><h2>🎮 You're in!</h2><p>Wait for the host to assign random teams and start the game.</p><p class="muted">Do not close this tab.</p></section>`}
else if(state.status==='missions'&&t){const d=content.departments[t.id-1];out+=`<section class="card"><div class="eyebrow">${esc(d.emoji)} ${esc(d.name)} · CLASSIFIED DEPARTMENT FILE</div><h2>${esc(d.intro)}</h2><div class="progress"><div style="width:${t.step/5*100}%"></div></div><p class="muted">${t.step}/5 investigations solved</p></section>`;if(t.step<5){let p=d.puzzles[t.step],key=t.id+':'+t.step;if(lastPuzzleKey!==key){choice='';lastPuzzleKey=key}out+=`<section class="card"><span class="pill">FILE ${t.step+1} / 5</span><h2 style="margin-top:12px">🔐 ${esc(p.title)}</h2><p>${esc(p.story)}</p><h3>Evidence</h3>${p.evidence.map(e=>`<div class="clue">${esc(e)}</div>`).join('')}<h3>${esc(p.question)}</h3>${p.kind==='choice'?p.options.map(o=>`<button class="option ${choice===o[0]?'selected':''}" data-choice="${o[0]}"><b>${esc(o[0])}.</b> ${esc(o[1])}</button>`).join(''):`<input id="numberAnswer" type="text" inputmode="decimal" placeholder="Enter your answer" value="${esc(choice)}">`}<div class="note"><b>⚡ TEAM SYNC RULE:</b> Agree out loud first. Once the first person submits, every <b>online</b> teammate has 3 seconds to submit the <b>identical</b> answer. One mismatch or timeout resets the attempt.</div><div class="flex" style="margin-top:14px">${btn('🔓 Submit synchronized answer','answer','primary')}${state.hintsEnabled?btn('💡 Show hint','hint'):''}</div>${state.hintsEnabled?`<p id="hint" class="muted" hidden>${esc(p.hint)}</p>`:''}<p class="small">${esc(t.lastOutcome||'')}</p>${t.window?`<p class="count">⏱ <span data-countdown="${t.window.endsAt}">3.0</span>s · ${t.window.answers.length}/${t.playerIds.filter(id=>state.players.find(p=>p.id===id)?.online).length} votes received</p>`:''}</section>`}else out+=`<section class="card center"><h2 class="good">🔓 Department unlocked!</h2><p>Your team's confidential evidence word is:</p><div class="big">${esc(d.fragment)}</div><p>Explain what you discovered to the other departments when the CEO starts the final mission.</p><p class="muted">Waiting for all five departments to finish.</p></section>`}
else if(state.status==='final'&&t){let d=content.departments[t.id-1];out+=`<section class="card"><div class="eyebrow">FINAL MISSION · ALL DEPARTMENTS</div><h2>🚨 ${esc(content.finale.title)}</h2><p>${esc(content.finale.story)}</p>${!t.fragmentSubmitted?`<p>Your department discovered: <b>${esc(d.fragment)}</b>. Submit this evidence to the board.</p><input id="fragment" placeholder="Enter your evidence word">${btn('Send evidence to board','fragment','primary')}`:`<p class="good">Your department's evidence was submitted!</p>`}<p>Company-wide evidence: ${state.teams.filter(x=>x.fragmentSubmitted).length}/5 submitted</p></section>`;if(state.allFragments&&!t.finalApproved){out+=`<section class="card"><h2>🏛️ Final board vote</h2><p>All five departments have contributed. Debate the plan across teams, then coordinate with YOUR team to submit the same choice within 3 seconds.</p><h3>${esc(content.finale.question)}</h3><input id="finalWords" placeholder="Five evidence words in department order" value="${esc(choice)}"><div class="note">Every online member of your team must vote identically within three seconds.</div><div style="margin-top:12px">${btn('Submit final team vote','finalanswer','primary')}</div><p>${esc(t.lastOutcome||'')}</p>${t.window?`<p class="count">⏱ <span data-countdown="${t.window.endsAt}">3.0</span>s</p>`:''}</section>`}else if(t.finalApproved)out+=`<section class="card"><h2 class="good">✅ Your team approved the rescue plan!</h2><p>Waiting for the other teams to finish their synchronized votes.</p></section>`}
else if(state.status==='complete')out+=`<section class="card center"><div class="big">🏆</div><h2>COMPANY SAVED!</h2><p>Five departments contributed different evidence. The final decision required all of them.</p><p class="good">Mission accomplished.</p></section>`;
else if(state.status==='ended')out+='<section class="card">The host ended the game.</section>';
setHtml(out)}
function render(){if(!content)return;if(!state)return home();if(role==='host')host();else student()}
function bind(){document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{let a=el.dataset.action;if(a==='create')call('host:create',{},r=>{role='host';pin=r.pin;token=r.token;state=r.state;sessionStorage.setItem('escapeHost',JSON.stringify({pin,token}));render()});if(a==='join'){let name=document.getElementById('name')?.value,p=document.getElementById('pin')?.value;call('player:join',{pin:p,name},r=>{role='student';myId=r.playerId;pin=p;state=r.state;sessionStorage.setItem('escapePlayer',JSON.stringify({pin,playerId:myId,name}));render()})}if(a==='assign')call('host:assign');if(a==='start')call('host:start');if(a==='stop'&&confirm('End the game for everyone?'))call('host:stop');if(a==='final')call('host:final');if(a==='hints')call('host:hints',{enabled:!state.hintsEnabled});if(a==='answer'){let v=document.getElementById('numberAnswer')?.value??choice;if(!String(v).trim())return notify('Choose or enter an answer first.');call('team:answer',{answer:v})}if(a==='fragment'){let v=document.getElementById('fragment')?.value;call('team:fragment',{fragment:v})}if(a==='finalanswer'){let v=document.getElementById('finalWords')?.value;if(!v?.trim())return notify('Enter all five evidence words.');call('final:answer',{answer:v})}if(a==='hint'){let h=document.getElementById('hint');if(h)h.hidden=false}});document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{tab=el.dataset.tab;render()});document.querySelectorAll('[data-team]').forEach(el=>el.onclick=()=>{monitorTeam=Number(el.dataset.team);render()});document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{choice=el.dataset.choice;document.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('selected',x.dataset.choice===choice))})}
setInterval(()=>{document.querySelectorAll('[data-countdown]').forEach(el=>{let v=Math.max(0,(Number(el.dataset.countdown)-Date.now())/1000);el.textContent=v.toFixed(1)})},100);
socket.on('game:state',s=>{state=s;render()});socket.on('connect',()=>{let h=sessionStorage.getItem('escapeHost'),p=sessionStorage.getItem('escapePlayer');if(h){try{let x=JSON.parse(h);call('host:resume',x,r=>{role='host';token=x.token;pin=x.pin;state=r.state;render()})}catch{home()}}else if(p){try{let x=JSON.parse(p);call('player:join',x,r=>{role='student';myId=r.playerId;pin=x.pin;state=r.state;render()})}catch{home()}}});
fetch('/api/content').then(r=>r.json()).then(d=>{content=d;render()}).catch(()=>notify('Unable to load game data.'));
</script></body></html>
